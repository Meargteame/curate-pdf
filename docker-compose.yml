services:
  curatepdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: curatepdf-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - APP_DOMAIN=curatepdf.site
    volumes:
      - curatepdf-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  curatepdf-data:
